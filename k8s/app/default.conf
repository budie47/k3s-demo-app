server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        ssi on;            # fills in the pod hostname and time in index.html
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
